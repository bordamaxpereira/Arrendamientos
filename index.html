    <!-- LÓGICA -->
    <script>
        let enteredPin = "";
        const correctPin = "6646";
        const GOOGLE_SCRIPT_URL = "https://google.com";
        let filtroContratos = 'activos';
        let tipoReporteActual = 'mes';

        window.addEventListener('keydown', function (e) {
            let lock = document.getElementById('lockScreen');
            if (lock && !lock.classList.contains('hidden')) {
                if (e.key >= '0' && e.key <= '9') {
                    pressPin(e.key);
                } else if (e.key === 'Backspace') {
                    clearPin();
                } else if (e.key === 'Enter') {
                    verifyPin();
                }
            }
        });

        function pressPin(n) {
            if(enteredPin.length < 4) {
                enteredPin += n;
                updatePinDots();
                if(enteredPin.length === 4) {
                    verifyPin();
                }
            }
        }

        function clearPin() {
            enteredPin = "";
            updatePinDots();
            document.getElementById('pinError').classList.add('hidden');
        }

        function updatePinDots() {
            for(let i = 1; i <= 4; i++) {
                let dot = document.getElementById(`pin${i}`);
                if(dot) dot.value = i <= enteredPin.length ? "*" : "";
            }
        }

        function verifyPin() {
            if(enteredPin === correctPin) {
                let lock = document.getElementById('lockScreen');
                if(lock) lock.classList.add('hidden');
                document.getElementById('reporteAnio').value = new Date().getFullYear();
                document.getElementById('reporteMes').value = String(new Date().getMonth() + 1).padStart(2, '0');
                renderAll();
                sincronizarDatos();
            } else {
                let err = document.getElementById('pinError');
                if(err) err.classList.remove('hidden');
                enteredPin = "";
                updatePinDots();
            }
        }

        function lockApp() {
            enteredPin = "";
            updatePinDots();
            let lock = document.getElementById('lockScreen');
            if(lock) lock.classList.remove('hidden');
        }

        let db = JSON.parse(localStorage.getItem('adminArriendosDB_v2')) || { contratos: [], pagos: [] };

        function saveData() {
            localStorage.setItem('adminArriendosDB_v2', JSON.stringify(db));
            renderAll();
        }

        function syncToGoogleSheets(payload) {
            actualizarEstadoSync('sincronizando');
            fetch(GOOGLE_SCRIPT_URL, {
                method: "POST",
                mode: "no-cors",
                headers: { "Content-Type": "text/plain" },
                body: JSON.stringify(payload)
            }).then(() => {
                actualizarEstadoSync('ok');
            }).catch(e => {
                console.log("Sync error", e);
                actualizarEstadoSync('error');
            });
        }

        function sincronizarDatos() {
            actualizarEstadoSync('sincronizando');
            fetch(GOOGLE_SCRIPT_URL)
                .then(res => res.json())
                .then(data => {
                    if (data && data.contratos) {
                        if(data.contratos.length > 0) db.contratos = data.contratos;
                        if(data.pagos && data.pagos.length > 0) db.pagos = data.pagos;
                        saveData();
                    }
                    actualizarEstadoSync('ok');
                })
                .catch(err => {
                    console.log("Modo offline o CORS:", err);
                    actualizarEstadoSync('ok');
                });
        }

        function actualizarEstadoSync(estado) {
            let dot = document.getElementById('syncDot');
            let text = document.getElementById('syncText');
            if(!dot || !text) return;

            if(estado === 'sincronizando') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping";
                text.innerText = "Sincronizando...";
            } else if(estado === 'ok') {
                dot.className = "w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse";
                text.innerText = "Sincronizado";
            } else {
                dot.className = "w-2.5 h-2.5 rounded-full bg-red-500";
                text.innerText = "Sin conexión";
            }
        }

        function setFiltroContratos(tipo) {
            filtroContratos = tipo;
            ['activos', 'inactivos', 'todos'].forEach(f => {
                let btn = document.getElementById(`filter-${f}`);
                if(btn) {
                    if(f === tipo) {
                        btn.className = "flex-1 py-1.5 rounded-lg text-center transition bg-white text-blue-900 shadow font-bold";
                    } else {
                        btn.className = "flex-1 py-1.5 rounded-lg text-center transition text-gray-600 hover:text-gray-900 font-semibold";
                    }
                }
            });
            renderAll();
        }

        function cambiarSubReporte(tipo) {
            tipoReporteActual = tipo;
            let btnMes = document.getElementById('btnSubMes');
            let btnInq = document.getElementById('btnSubInquilino');
            let divMes = document.getElementById('filtroMesContainer');
            let divInq = document.getElementById('filtroInquilinoContainer');

            if(tipo === 'mes') {
                btnMes.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-900 text-white";
                btnInq.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-200 text-gray-700";
                divMes.classList.remove('hidden');
                divInq.classList.add('hidden');
            } else {
                btnInq.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-900 text-white";
                btnMes.className = "px-3 py-1.5 rounded-lg text-xs font-bold bg-gray-200 text-gray-700";
                divInq.classList.remove('hidden');
                divMes.classList.add('hidden');
            }
            generarReporte();
        }

        function switchTab(t) {
            ['dashboard', 'contratos', 'pagos', 'reportes'].forEach(tab => {
                let elTab = document.getElementById(`tab-${tab}`);
                let elNav = document.getElementById(`nav-${tab}`);
                if(elTab) elTab.classList.add('hidden');
                if(elNav) elNav.className = "text-gray-400 flex flex-col items-center text-xs font-semibold";
            });
            let targetTab = document.getElementById(`tab-${t}`);
            let targetNav = document.getElementById(`nav-${t}`);
            if(targetTab) targetTab.classList.remove('hidden');
            if(targetNav) targetNav.className = "text-blue-900 flex flex-col items-center text-xs font-semibold";
            
            if(t === 'reportes') {
                cargarSelectReportesInquilinos();
                generarReporte();
            }
            renderAll();
        }

        function openContratoModal(idx = -1) {
            let modal = document.getElementById('contratoModal');
            if(modal) modal.classList.remove('hidden');
            if(idx >= 0) {
                let c = db.contratos.at(idx);
                document.getElementById('editIndex').value = idx;
                document.getElementById('modalTitle').innerText = "Editar Contrato";
                document.getElementById('propiedad').value = c.propiedad;
                document.getElementById('inquilino').value = c.inquilino;
                document.getElementById('telefono').value = c.telefono;
                document.getElementById('ref1Nombre').value = c.ref1Nombre || "";
                document.getElementById('ref1Tel').value = c.ref1Tel || "";
                document.getElementById('ref2Nombre').value = c.ref2Nombre || "";
                document.getElementById('ref2Tel').value = c.ref2Tel || "";
                document.getElementById('obsInquilino').value = c.obsInquilino || "";
                document.getElementById('fiador').value = c.fiador || "";
                document.getElementById('telFiador').value = c.telFiador || "";
                document.getElementById('ref1FiadorNombre').value = c.ref1FiadorNombre || "";
                document.getElementById('ref1FiadorTel').value = c.ref1FiadorTel || "";
                document.getElementById('ref2FiadorNombre').value = c.ref2FiadorNombre || "";
                document.getElementById('ref2FiadorTel').value = c.ref2FiadorTel || "";
                document.getElementById('obsFiador').value = c.obsFiador || "";
                document.getElementById('canon').value = c.canon;
                document.getElementById('deposito').value = c.deposito || 0;
                document.getElementById('fechaFirma').value = String(c.fechaFirma).split('T').shift();
                document.getElementById('fechaVencimiento').value = String(c.fechaVencimiento).split('T').shift();
            } else {
                document.getElementById('editIndex').value = -1;
                document.getElementById('modalTitle').innerText = "Nuevo Contrato";
                let form = document.getElementById('contratoForm');
                if(form) form.reset();
            }
        }

        function closeContratoModal() {
            let modal = document.getElementById('contratoModal');
            if(modal) modal.classList.add('hidden');
        }

        function guardarContrato(e) {
            e.preventDefault();
            let idx = parseInt(document.getElementById('editIndex').value);
            let c = {
                id: idx >= 0 ? db.contratos.at(idx).id : "CTO-" + Date.now(),
        function obtenerPagosDeContrato(c) {
            let lista = db.pagos.filter(p =>
                (p.contratoId && p.contratoId === c.id) ||
                (p.propiedad && p.propiedad.trim().toLowerCase() === c.propiedad.trim().toLowerCase() &&
                 p.inquilino && p.inquilino.trim().toLowerCase() === c.inquilino.trim().toLowerCase())
            );
            return lista.sort((a, b) => extraerFinPeriodo(b.concepto) - extraerFinPeriodo(a.concepto));
        }

        function extraerFinPeriodo(concepto) {
            if (!concepto || !concepto.includes(" - ")) return new Date(0);
            let partes = concepto.split(" - ");
            return parseDate(partes.pop().trim());
        }

        function autoFillPagoInfo() {
            let idx = document.getElementById('pagoContratoId').value;
            renderHistorialRecibos(idx);

            if (idx === "") {
                document.getElementById('pagoValor').value = "";
                document.getElementById('pagoConcepto').value = "";
                return;
            }

            let c = db.contratos.at(Number(idx));
            document.getElementById('pagoValor').value = c.canon;

            let pagosContrato = obtenerPagosDeContrato(c);
            let fechaBaseStr = String(c.fechaFirma).split('T').shift();
            let fechaInicio = new Date(fechaBaseStr + "T00:00:00");

            if (pagosContrato.length > 0) {
                let ultPago = pagosContrato.at(0);
                let fHasta = extraerFinPeriodo(ultPago.concepto);
                if (!isNaN(fHasta.getTime()) && fHasta.getFullYear() > 2000) {
                    fechaInicio = new Date(fHasta);
                    fechaInicio.setDate(fechaInicio.getDate() + 1);
                }
            }

            let fechaFin = new Date(fechaInicio);
            fechaFin.setMonth(fechaFin.getMonth() + 1);
            fechaFin.setDate(fechaFin.getDate() - 1);

            document.getElementById('pagoConcepto').value = `${formatDate(fechaInicio)} - ${formatDate(fechaFin)}`;
        }

        function renderHistorialRecibos(idxSeleccionado = "") {
            let rList = document.getElementById('recibosList');
            if (!rList) return;

            let pagosMostrar = [];
            let tituloFiltro = "";

            if (idxSeleccionado !== "" && db.contratos.at(Number(idxSeleccionado))) {
                let c = db.contratos.at(Number(idxSeleccionado));
                pagosMostrar = obtenerPagosDeContrato(c);
                tituloFiltro = `<div class="bg-blue-50 text-blue-900 text-[11px] font-bold px-3 py-1.5 rounded-lg mb-2 flex justify-between items-center">
                    <span>Mostrando recibos de: ${c.inquilino}</span>
                    <span>${pagosMostrar.length} pago(s)</span>
                </div>`;
            } else {
                pagosMostrar = [...db.pagos].sort((a, b) => extraerFinPeriodo(b.concepto) - extraerFinPeriodo(a.concepto));
            }

            if (pagosMostrar.length === 0) {
                rList.innerHTML = tituloFiltro + `<p class="text-xs text-gray-400 italic text-center py-4">Este inquilino aún no tiene recibos registrados.</p>`;
                return;
            }

            rList.innerHTML = tituloFiltro + pagosMostrar.map((p, index) => {
                let fechaLimpia = String(p.fecha).includes('T') ? formatDate(new Date(p.fecha)) : p.fecha;
                let badgeReciente = index === 0 ? `<span class="bg-emerald-100 text-emerald-800 text-[9px] font-bold px-1.5 py-0.5 rounded ml-1">MÁS RECIENTE</span>` : "";
                return `
                    <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg border ${index === 0 ? 'border-emerald-300 bg-emerald-50/30' : ''} text-xs">
                        <div>
                            <p class="font-bold text-gray-800">${p.propiedad} - ${p.inquilino} ${badgeReciente}</p>
                            <p class="text-[10px] text-gray-600 font-semibold">Período: <span class="text-blue-900">${p.concepto}</span></p>
                            <p class="text-[10px] text-gray-400">${p.id} | Emitido: ${fechaLimpia}</p>
                        </div>
                        <div class="text-right flex items-center gap-3">
                            <span class="font-bold text-green-700">$${Number(p.valor).toLocaleString()}</span>
                            <button type="button" onclick='verReciboModal(${JSON.stringify(p)})' class="text-blue-900 text-sm"><i class="fa-solid fa-eye"></i></button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function registrarPago(e) {
            e.preventDefault();
            let cIdx = document.getElementById('pagoContratoId').value;
            let val = parseFloat(document.getElementById('pagoValor').value);
            let con = document.getElementById('pagoConcepto').value;
            let c = db.contratos.at(Number(cIdx));

            let pago = {
                id: "REC-" + Math.floor(1000 + Math.random() * 9000),
                contratoId: c.id,
                fecha: formatDate(new Date()),
                propiedad: c.propiedad,
                inquilino: c.inquilino,
                telefono: c.telefono,
                valor: val,
                concepto: con
            };

            db.pagos.unshift(pago);
            saveData();
            syncToGoogleSheets({ tipo: "pago", ...pago });
            let form = document.getElementById('pagoForm');
            if(form) form.reset();
            renderHistorialRecibos("");
            verReciboModal(pago);
        }

        function verReciboModal(pago) {
            let fechaLimpia = String(pago.fecha).includes('T') ? formatDate(new Date(pago.fecha)) : pago.fecha;
            document.getElementById('vReciboId').innerText = pago.id;
            document.getElementById('vFecha').innerText = fechaLimpia;
            document.getElementById('vInquilino').innerText = pago.inquilino;
            document.getElementById('vValor').innerText = Number(pago.valor).toLocaleString();
            document.getElementById('vValorText').innerText = numeroALetras(Number(pago.valor));
            document.getElementById('vPropiedad').innerText = pago.propiedad;
            document.getElementById('vConcepto').innerText = pago.concepto;

            document.getElementById('tempTel').value = pago.telefono || "";
            document.getElementById('tempReciboId').value = pago.id;

            document.getElementById('previewImagenArea').classList.add('hidden');
            document.getElementById('imageContainer').innerHTML = "";

            let modal = document.getElementById('reciboViewModal');
            if(modal) modal.classList.remove('hidden');
        }

        function closeReciboModal() {
            let modal = document.getElementById('reciboViewModal');
            if(modal) modal.classList.add('hidden');
        }

        function generarImagenRecibo() {
            let target = document.getElementById('reciboPrintArea');
            let tel = document.getElementById('tempTel').value;
            let reciboId = document.getElementById('tempReciboId').value;
            let btnGenerar = document.getElementById('btnGenerarImg');

            btnGenerar.innerText = "Procesando...";
            btnGenerar.disabled = true;

            html2canvas(target, { scale: 2, useCORS: true }).then(canvas => {
                let imgData = canvas.toDataURL("image/png");
                
                let container = document.getElementById('imageContainer');
                container.innerHTML = `<img src="${imgData}" class="max-h-48 object-contain rounded border shadow" />`;

                let btnDownload = document.getElementById('btnDescargarImg');
                btnDownload.href = imgData;
                btnDownload.download = `Recibo_${reciboId}.png`;

                let msg = encodeURIComponent(`Hola, le comparto el comprobante de pago *${reciboId}*. ¡Muchas gracias por su cumplimiento! - Alexander Pérez Ladino`);
                let btnWpp = document.getElementById('btnWhatsAppDirecto');
                btnWpp.href = `https://wa.me{tel}?text=${msg}`;

                document.getElementById('previewImagenArea').classList.remove('hidden');
                
                btnGenerar.innerText = "Convertir a Imagen PNG";
                btnGenerar.disabled = false;
            }).catch(err => {
                console.error(err);
                alert("Error al procesar la imagen.");
                btnGenerar.innerText = "Convertir a Imagen PNG";
                btnGenerar.disabled = false;
            });
        }
